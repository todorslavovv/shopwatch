<title>Merchant Disclosure Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EDEFF2; --surface:#FAFBFC; --surface-2:#F1F3F6;
  --ink:#14181F; --ink-soft:#5A6472; --ink-faint:#8B94A1;
  --rule:#CBD2DB; --rule-soft:#DFE4EA;
  --accent:#1F4E79; --accent-soft:#E3EBF3;
  --seal:#A8232B; --seal-soft:#F5E3E4;
  --verify:#1E6B52; --verify-soft:#E0EDE8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1319; --surface:#161B23; --surface-2:#1C222C;
    --ink:#E4E8EE; --ink-soft:#8994A3; --ink-faint:#6A7482;
    --rule:#2B333F; --rule-soft:#222933;
    --accent:#6FA8DC; --accent-soft:#17304A;
    --seal:#E06A72; --seal-soft:#3A1B1E;
    --verify:#4FB08A; --verify-soft:#12332A;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1319; --surface:#161B23; --surface-2:#1C222C;
  --ink:#E4E8EE; --ink-soft:#8994A3; --ink-faint:#6A7482;
  --rule:#2B333F; --rule-soft:#222933;
  --accent:#6FA8DC; --accent-soft:#17304A;
  --seal:#E06A72; --seal-soft:#3A1B1E;
  --verify:#4FB08A; --verify-soft:#12332A;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  margin:0; text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.masthead{border-bottom:2px solid var(--ink); background:var(--surface)}
.mast-in{max-width:1180px; margin:0 auto; padding:18px 24px 15px}
.tag{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
  border:1px solid var(--accent); padding:2px 7px; margin-bottom:7px}
.masthead h1{font-size:26px; font-weight:700; letter-spacing:.02em}
.masthead .sub{color:var(--ink-soft); font-size:13px; max-width:70ch; margin-top:3px}
.wrap{max-width:1180px; margin:0 auto; padding:20px 24px 56px;
  display:flex; flex-direction:column; gap:20px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:2px}
.panel > header{padding:10px 16px; border-bottom:1px solid var(--rule-soft);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.panel > header h2{font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase}
.panel > header .note{font-size:11px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace}

/* verdict */
.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px; padding:20px 16px; align-items:center}
@media (max-width:720px){.verdict{grid-template-columns:1fr}}
.stampbox{border:3px double var(--verify); color:var(--verify); padding:12px 20px; text-align:center}
.stampbox.bad{border-color:var(--seal); color:var(--seal)}
.stampbox .big{font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700; font-size:30px;
  letter-spacing:.1em; text-transform:uppercase; line-height:1.1}
.stampbox .small{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; margin-top:4px}
.vsum{font-size:14px; color:var(--ink-soft); max-width:66ch}
.vsum strong{color:var(--ink)}
.kv{display:grid; grid-template-columns:auto minmax(0,1fr); gap:5px 16px; margin-top:12px; font-size:13px}
.kv dt{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-faint); padding-top:3px; white-space:nowrap}
.kv dd{margin:0; font-family:"IBM Plex Mono",monospace; font-size:12px; word-break:break-all}

.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px}
.body-pad{padding:14px 16px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:400; padding:8px 16px;
  border-bottom:1px solid var(--rule); white-space:nowrap}
td{padding:7px 16px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
td.h{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-soft); word-break:break-all}
td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
td.p{font-family:"IBM Plex Mono",monospace; font-size:12px; word-break:break-all}
tr.bad td{background:var(--seal-soft)}
.st{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  padding:2px 7px; border-radius:2px; white-space:nowrap; display:inline-block;
  background:var(--verify-soft); color:var(--verify)}
.st.bad{background:var(--seal-soft); color:var(--seal); font-weight:500}
.actions{margin:0; padding:0 0 0 18px; font-size:13px; color:var(--ink-soft)}
.actions li{margin:3px 0}
.proof{display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:0}
.proof > div{padding:14px 16px; border-right:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft)}
.proof h3{font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px}
.proof h3.yes{color:var(--verify)} .proof h3.no{color:var(--seal)}
.proof ul{margin:0; padding-left:17px; font-size:13px; color:var(--ink-soft)}
.proof li{margin:4px 0}
footer.page{max-width:1180px; margin:0 auto; padding:0 24px 50px; color:var(--ink-faint); font-size:12px}
footer.page p{max-width:84ch}

.facts{display:flex; gap:24px; flex-wrap:wrap; margin-top:13px}
.fact .k{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-faint)}
.fact .v{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;
  font-family:"IBM Plex Sans Condensed",sans-serif; line-height:1.2}
.fact .v.bad{color:var(--seal)} .fact .v.good{color:var(--verify)} .fact .v.warn{color:var(--warn)}
:root{--warn:#8A5B14; --warn-soft:#F6EBDA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#D9A441; --warn-soft:#33280F}}
:root[data-theme="dark"]{--warn:#D9A441; --warn-soft:#33280F}

.shop{border-bottom:1px solid var(--rule-soft); border-left:3px solid var(--rule);
  display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:0}
@media (max-width:760px){.shop{grid-template-columns:1fr}}
.shop.v-noncompliant{border-left-color:var(--seal)}
.shop.v-suspect{border-left-color:var(--warn)}
.shop.v-ok{border-left-color:var(--verify)}
.shop-main{padding:13px 16px}
.shop-side{padding:13px 16px; border-left:1px solid var(--rule-soft); background:var(--surface-2)}
@media (max-width:760px){.shop-side{border-left:0; border-top:1px solid var(--rule-soft)}}
.shop-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.shop-dom{font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:500; word-break:break-all}
.score{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:19px; font-weight:600}
.score.bad{color:var(--seal)} .score.warn{color:var(--warn)} .score.good{color:var(--verify)}
.vchip{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; padding:2px 8px; border-radius:2px; font-weight:500}
.vchip.v-noncompliant{background:var(--seal-soft); color:var(--seal)}
.vchip.v-suspect{background:var(--warn-soft); color:var(--warn)}
.vchip.v-ok{background:var(--verify-soft); color:var(--verify)}
.findings{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
.f{font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:2px 6px; border-radius:2px;
  border:1px solid var(--rule); color:var(--ink-soft)}
.f.critical{border-color:var(--seal); color:var(--seal); background:var(--seal-soft)}
.fields{display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 13px; font-size:12.5px}
.fields dt{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-faint); padding-top:2px; white-space:nowrap}
.fields dd{margin:0; word-break:break-word}
.fields dd.miss{color:var(--ink-faint); font-style:italic}
.fields dd.mono{font-family:"IBM Plex Mono",monospace}
.snip{margin-top:10px; font-size:11.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace;
  border-left:2px solid var(--rule); padding-left:9px; line-height:1.45}
</style>

<div class="masthead"><div class="mast-in">
  <span class="tag">Shopwatch &middot; merchant disclosure</span>
  <h1>Merchant Disclosure Triage</h1>
  <div class="sub">Bulgarian online shops ranked by how far their published trader identity
    falls short of what the law requires. Every check runs offline against the page itself
    &mdash; no register lookup, no personal data.</div>
  <div class="facts" id="facts"></div>
</div></div>

<div class="wrap" id="app"></div>

<footer class="page">
  <p id="prov"></p>
</footer>

<script>
const DATA = [{"domain": "tehnomag-bg.com", "merchant": {"eik": "204511873", "company_name": "ТЕХНОМАГ БЪЛГАРИЯ ЕООД", "address": "гр. София, бул. Цариградско шосе 115, ет.4", "email": "office@tehnomag-bg.com", "phone": "+359 2 970 4400", "vat_number": "BG204511873"}, "evidence": {"eik": "ЕИК: 204511873", "phone": "Тел: +359 2 970 4400", "email": "Ел. поща: office@tehnomag-bg.com", "vat_number": "ИН по ЗДДС: BG204511873", "address": "гр. София, бул. Цариградско шосе 115, ет.4", "company_name": "\"ТЕХНОМАГ БЪЛГАРИЯ\" ЕООД"}, "assessment": {"score": 0, "verdict": "ok", "findings": []}}, {"domain": "moda-sofia.shop", "merchant": {"eik": "177229030", "company_name": "МОДА СОФИЯ ООД", "address": "гр. Пловдив, ул. Иван Вазов 18", "email": "info@moda-sofia.shop", "phone": null, "vat_number": null}, "evidence": {"eik": "ЕИК 177229030", "email": "Имейл: info@moda-sofia.shop", "address": "гр. Пловдив, ул. Иван Вазов 18", "company_name": "МОДА СОФИЯ ООД"}, "assessment": {"score": 10, "verdict": "ok", "findings": [{"code": "NO_PHONE", "severity": "warning", "message": "No phone published (email present)."}, {"code": "NO_VAT", "severity": "info", "message": "No VAT number published (informational: not required for all traders)."}]}}, {"domain": "elektro-market.bg", "merchant": {"eik": "133900556", "company_name": null, "address": null, "email": null, "phone": "0888 123 456", "vat_number": null}, "evidence": {"eik": "ЕИК/БУЛСТАТ: 133900556", "phone": "Тел: 0888 123 456"}, "assessment": {"score": 40, "verdict": "suspect", "findings": [{"code": "NO_ADDRESS", "severity": "warning", "message": "No business address published."}, {"code": "NO_EMAIL", "severity": "warning", "message": "No email published (phone present)."}, {"code": "NO_COMPANY", "severity": "warning", "message": "No company name published."}, {"code": "NO_VAT", "severity": "info", "message": "No VAT number published (informational: not required for all traders)."}]}}, {"domain": "luxury-watches24.cfd", "merchant": {"eik": null, "company_name": null, "address": null, "email": "support@luxury-watches24.cfd", "phone": null, "vat_number": null}, "evidence": {"email": "Контакти: support@luxury-watches24.cfd"}, "assessment": {"score": 90, "verdict": "noncompliant", "findings": [{"code": "NO_EIK", "severity": "error", "message": "No EIK/UIC identifier published on the shop site."}, {"code": "NO_ADDRESS", "severity": "warning", "message": "No business address published."}, {"code": "NO_PHONE", "severity": "warning", "message": "No phone published (email present)."}, {"code": "NO_COMPANY", "severity": "warning", "message": "No company name published."}, {"code": "NO_VAT", "severity": "info", "message": "No VAT number published (informational: not required for all traders)."}]}}, {"domain": "bg-outlet-sale.icu", "merchant": {"eik": "123456789", "company_name": null, "address": null, "email": null, "phone": null, "vat_number": null}, "evidence": {"eik": "ЕИК: 123456789"}, "assessment": {"score": 90, "verdict": "noncompliant", "findings": [{"code": "EIK_INVALID", "severity": "error", "message": "Published EIK '123456789' is structurally invalid: checksum mismatch: expected 6, got 9."}, {"code": "NO_ADDRESS", "severity": "warning", "message": "No business address published."}, {"code": "NO_CONTACT", "severity": "warning", "message": "No email and no phone published."}, {"code": "NO_COMPANY", "severity": "warning", "message": "No company name published."}, {"code": "NO_VAT", "severity": "info", "message": "No VAT number published (informational: not required for all traders)."}]}}, {"domain": "mega-promo-bg.sbs", "merchant": {"eik": null, "company_name": null, "address": null, "email": null, "phone": null, "vat_number": null}, "evidence": {}, "assessment": {"score": 100, "verdict": "noncompliant", "findings": [{"code": "NO_EIK", "severity": "error", "message": "No EIK/UIC identifier published on the shop site."}, {"code": "NO_ADDRESS", "severity": "warning", "message": "No business address published."}, {"code": "NO_CONTACT", "severity": "warning", "message": "No email and no phone published."}, {"code": "NO_COMPANY", "severity": "warning", "message": "No company name published."}, {"code": "NO_VAT", "severity": "info", "message": "No VAT number published (informational: not required for all traders)."}]}}, {"domain": "detski-igri.eu", "merchant": {"eik": "200994718", "company_name": "ДЕТСКИ ИГРИ ЕООД", "address": "с. Бистрица, ул. Речна 4", "email": "office@detski-igri.eu", "phone": "02 987 1122", "vat_number": null}, "evidence": {"eik": "ЕИК: 200994718", "phone": "Тел: 02 987 1122", "email": "office@detski-igri.eu", "address": "с. Бистрица, ул. Речна 4", "company_name": "„ДЕТСКИ ИГРИ\" ЕООД"}, "assessment": {"score": 0, "verdict": "ok", "findings": [{"code": "NO_VAT", "severity": "info", "message": "No VAT number published (informational: not required for all traders)."}]}}, {"domain": "parfum-store.one", "merchant": {"eik": null, "company_name": null, "address": "гр. Бургас, ул. Александровска 22", "email": null, "phone": null, "vat_number": null}, "evidence": {"address": "Адрес: гр. Бургас, ул. Александровска 22"}, "assessment": {"score": 80, "verdict": "noncompliant", "findings": [{"code": "NO_EIK", "severity": "error", "message": "No EIK/UIC identifier published on the shop site."}, {"code": "NO_CONTACT", "severity": "warning", "message": "No email and no phone published."}, {"code": "NO_COMPANY", "severity": "warning", "message": "No company name published."}, {"code": "NO_VAT", "severity": "info", "message": "No VAT number published (informational: not required for all traders)."}]}}];
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ORDER = { noncompliant: 0, suspect: 1, ok: 2 };
const rows = [...DATA].sort((a, b) =>
  ORDER[a.assessment.verdict] - ORDER[b.assessment.verdict] ||
  b.assessment.score - a.assessment.score);

const tone = v => v === 'noncompliant' ? 'bad' : v === 'suspect' ? 'warn' : 'good';

// ---- summary -----------------------------------------------------------
const count = v => rows.filter(r => r.assessment.verdict === v).length;
document.getElementById('facts').innerHTML = [
  ['shops checked', rows.length, ''],
  ['non-compliant', count('noncompliant'), 'bad'],
  ['suspect', count('suspect'), 'warn'],
  ['compliant', count('ok'), 'good'],
].map(([k, v, c]) => `<div class="fact"><div class="k">${k}</div>
    <div class="v ${c}">${v}</div></div>`).join('');

// ---- worklist ----------------------------------------------------------
const FIELDS = [
  ['eik', 'ЕИК', true], ['company_name', 'Company', false], ['address', 'Address', false],
  ['phone', 'Phone', true], ['email', 'Email', true], ['vat_number', 'ДДС', true],
];

const shopHtml = r => {
  const a = r.assessment, m = r.merchant, v = a.verdict;
  const crit = new Set(a.findings.filter(f =>
    /^(NO_EIK|EIK_INVALID)$/.test(f.code)).map(f => f.code));
  const critMsg = a.findings.find(f => crit.has(f.code));
  const snips = Object.entries(r.evidence || {}).slice(0, 2)
    .map(([k, s]) => `${k}: ${String(s).replace(/\s+/g, ' ').trim().slice(0, 110)}`);

  return `<article class="shop v-${esc(v)}">
    <div class="shop-main">
      <div class="shop-head">
        <span class="shop-dom">${esc(r.domain)}</span>
        <span class="vchip v-${esc(v)}">${esc(v)}</span>
        <span class="score ${tone(v)}">${a.score}</span>
      </div>
      ${critMsg ? `<div style="margin-top:7px;font-size:13px;color:var(--seal)">
          ${esc(critMsg.message)}</div>` : ''}
      <div class="findings">${a.findings.map(f =>
        `<span class="f${crit.has(f.code) ? ' critical' : ''}">${esc(f.code)}</span>`).join('')
        || '<span class="f">no findings</span>'}</div>
      ${snips.length ? `<div class="snip">${snips.map(esc).join('<br>')}</div>` : ''}
    </div>
    <div class="shop-side">
      <dl class="fields">${FIELDS.map(([k, label, mono]) => {
        const val = m[k];
        return `<dt>${esc(label)}</dt><dd class="${val ? (mono ? 'mono' : '') : 'miss'}">${
          val ? esc(val) : 'not published'}</dd>`;
      }).join('')}</dl>
    </div>
  </article>`;
};

// ---- page --------------------------------------------------------------
document.getElementById('app').innerHTML = `
  <section class="panel">
    <header><h2>Triage worklist</h2>
      <span class="note">worst first &middot; score is a heuristic, not a probability</span></header>
    ${rows.map(shopHtml).join('')}
  </section>

  <section class="panel">
    <header><h2>How a shop is judged</h2></header>
    <div class="proof">
      <div><h3 class="yes">Checked offline</h3><ul>
        <li>Whether an ЕИК is published at all &mdash; Bulgarian law requires it of an online trader.</li>
        <li>Whether a published ЕИК passes its mod-11 checksum.</li>
        <li>Whether a registered address and a means of contact are given.</li>
        <li>Labels are read in Bulgarian and English, including values split across page markup.</li>
      </ul></div>
      <div><h3 class="no">Deliberately not claimed</h3><ul>
        <li><strong>A valid checksum does not mean the company exists.</strong> That needs the
            Commercial Register, which is not queried here.</li>
        <li>A bare nine-digit number is never read as an ЕИК &mdash; prices, order numbers and
            phone numbers would all qualify.</li>
        <li>Nothing identifies a person. Directors and owners are out of scope by design.</li>
        <li>A missing disclosure is a legal shortfall, not proof of fraud.</li>
      </ul></div>
    </div>
  </section>`;

document.getElementById('prov').innerHTML =
  `Assessed offline from page markup alone &mdash; no register queries, no network calls, ` +
  `no personal data collected. Scores weight a missing or invalid identifier most heavily; ` +
  `the weighting is documented in the source and is a triage heuristic, not a probability of fraud.`;

</script>
