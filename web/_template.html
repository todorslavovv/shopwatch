<title>Триаж на търговци</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EDEFF2; --surface:#FAFBFC; --surface-2:#F1F3F6;
  --ink:#14181F; --ink-soft:#5A6472; --ink-faint:#8B94A1;
  --rule:#CBD2DB; --rule-soft:#DFE4EA;
  --accent:#1F4E79; --accent-soft:#E3EBF3;
  --seal:#A8232B; --seal-soft:#F5E3E4;
  --verify:#1E6B52; --verify-soft:#E0EDE8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1319; --surface:#161B23; --surface-2:#1C222C;
    --ink:#E4E8EE; --ink-soft:#8994A3; --ink-faint:#6A7482;
    --rule:#2B333F; --rule-soft:#222933;
    --accent:#6FA8DC; --accent-soft:#17304A;
    --seal:#E06A72; --seal-soft:#3A1B1E;
    --verify:#4FB08A; --verify-soft:#12332A;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1319; --surface:#161B23; --surface-2:#1C222C;
  --ink:#E4E8EE; --ink-soft:#8994A3; --ink-faint:#6A7482;
  --rule:#2B333F; --rule-soft:#222933;
  --accent:#6FA8DC; --accent-soft:#17304A;
  --seal:#E06A72; --seal-soft:#3A1B1E;
  --verify:#4FB08A; --verify-soft:#12332A;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  margin:0; text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.masthead{border-bottom:2px solid var(--ink); background:var(--surface)}
.mast-in{max-width:1180px; margin:0 auto; padding:18px 24px 15px}
.tag{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
  border:1px solid var(--accent); padding:2px 7px; margin-bottom:7px}
.masthead h1{font-size:26px; font-weight:700; letter-spacing:.02em}
.masthead .sub{color:var(--ink-soft); font-size:13px; max-width:70ch; margin-top:3px}
.wrap{max-width:1180px; margin:0 auto; padding:20px 24px 56px;
  display:flex; flex-direction:column; gap:20px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:2px}
.panel > header{padding:10px 16px; border-bottom:1px solid var(--rule-soft);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.panel > header h2{font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase}
.panel > header .note{font-size:11px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace}

/* verdict */
.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px; padding:20px 16px; align-items:center}
@media (max-width:720px){.verdict{grid-template-columns:1fr}}
.stampbox{border:3px double var(--verify); color:var(--verify); padding:12px 20px; text-align:center}
.stampbox.bad{border-color:var(--seal); color:var(--seal)}
.stampbox .big{font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700; font-size:30px;
  letter-spacing:.1em; text-transform:uppercase; line-height:1.1}
.stampbox .small{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; margin-top:4px}
.vsum{font-size:14px; color:var(--ink-soft); max-width:66ch}
.vsum strong{color:var(--ink)}
.kv{display:grid; grid-template-columns:auto minmax(0,1fr); gap:5px 16px; margin-top:12px; font-size:13px}
.kv dt{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-faint); padding-top:3px; white-space:nowrap}
.kv dd{margin:0; font-family:"IBM Plex Mono",monospace; font-size:12px; word-break:break-all}

.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr)); gap:20px}
.panel{min-width:0}
.tblwrap{min-width:0}
.body-pad{padding:14px 16px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:400; padding:8px 16px;
  border-bottom:1px solid var(--rule); white-space:nowrap}
td{padding:7px 16px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
td.h{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-soft); word-break:break-all}
td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
td.p{font-family:"IBM Plex Mono",monospace; font-size:12px; word-break:break-all}
tr.bad td{background:var(--seal-soft)}
.st{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  padding:2px 7px; border-radius:2px; white-space:nowrap; display:inline-block;
  background:var(--verify-soft); color:var(--verify)}
.st.bad{background:var(--seal-soft); color:var(--seal); font-weight:500}
.actions{margin:0; padding:0 0 0 18px; font-size:13px; color:var(--ink-soft)}
.actions li{margin:3px 0}
.proof{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr)); gap:0}
.proof > div{padding:14px 16px; border-right:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft)}
.proof h3{font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px}
.proof h3.yes{color:var(--verify)} .proof h3.no{color:var(--seal)}
.proof ul{margin:0; padding-left:17px; font-size:13px; color:var(--ink-soft)}
.proof li{margin:4px 0}
footer.page{max-width:1180px; margin:0 auto; padding:0 24px 50px; color:var(--ink-faint); font-size:12px}
footer.page p{max-width:84ch}

.facts{display:flex; gap:24px; flex-wrap:wrap; margin-top:13px}
.fact .k{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-faint)}
.fact .v{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;
  font-family:"IBM Plex Sans Condensed",sans-serif; line-height:1.2}
.fact .v.bad{color:var(--seal)} .fact .v.good{color:var(--verify)} .fact .v.warn{color:var(--warn)}
:root{--warn:#8A5B14; --warn-soft:#F6EBDA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#D9A441; --warn-soft:#33280F}}
:root[data-theme="dark"]{--warn:#D9A441; --warn-soft:#33280F}

.shop{border-bottom:1px solid var(--rule-soft); border-left:3px solid var(--rule);
  display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:0}
@media (max-width:760px){.shop{grid-template-columns:1fr}}
.shop.v-noncompliant{border-left-color:var(--seal)}
.shop.v-suspect{border-left-color:var(--warn)}
.shop.v-ok{border-left-color:var(--verify)}
.shop-main{padding:13px 16px}
.shop-side{padding:13px 16px; border-left:1px solid var(--rule-soft); background:var(--surface-2)}
@media (max-width:760px){.shop-side{border-left:0; border-top:1px solid var(--rule-soft)}}
.shop-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.shop-dom{font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:500; word-break:break-all}
.score{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:19px; font-weight:600}
.score.bad{color:var(--seal)} .score.warn{color:var(--warn)} .score.good{color:var(--verify)}
.vchip{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; padding:2px 8px; border-radius:2px; font-weight:500}
.vchip.v-noncompliant{background:var(--seal-soft); color:var(--seal)}
.vchip.v-suspect{background:var(--warn-soft); color:var(--warn)}
.vchip.v-ok{background:var(--verify-soft); color:var(--verify)}
.findings{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
.f{font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:2px 6px; border-radius:2px;
  border:1px solid var(--rule); color:var(--ink-soft)}
.f.critical{border-color:var(--seal); color:var(--seal); background:var(--seal-soft)}
.fields{display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 13px; font-size:12.5px}
.fields dt{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-faint); padding-top:2px; white-space:nowrap}
.fields dd{margin:0; word-break:break-word}
.fields dd.miss{color:var(--ink-faint); font-style:italic}
.fields dd.mono{font-family:"IBM Plex Mono",monospace}
.snip{margin-top:10px; font-size:11.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace;
  border-left:2px solid var(--rule); padding-left:9px; line-height:1.45}
/* language switcher */
.langsw{display:inline-flex; border:1px solid var(--rule); border-radius:2px; overflow:hidden;
  background:var(--surface)}
.lang{display:inline-flex; align-items:center; gap:6px; background:none; border:0; cursor:pointer;
  padding:5px 10px; color:var(--ink-soft); font:inherit; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; font-family:"IBM Plex Mono",monospace}
.lang + .lang{border-left:1px solid var(--rule)}
.lang:hover{background:var(--surface-2); color:var(--ink)}
.lang[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:500}
.lang:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.lang svg{display:block; width:19px; height:13px; border:1px solid var(--rule-soft)}

/* Touch targets: 27px tall is below the 44px minimum on a finger-driven screen. */
@media (pointer:coarse), (max-width:760px){
  .lang{padding:13px 14px; font-size:12px}
  .lang svg{width:21px; height:14px}
}

.whygrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr)); gap:0}
.whygrid > div{padding:14px 16px; border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft)}
.whygrid h3{font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--accent);
  margin-bottom:6px}
.whygrid p{margin:0; font-size:13.5px; color:var(--ink-soft); max-width:46ch}
.whynote{padding:13px 16px; font-size:13.5px; color:var(--ink-soft); background:var(--surface-2);
  border-top:1px solid var(--rule-soft); max-width:78ch}
.whynote strong{color:var(--ink)}
.livecheck{display:flex; gap:8px; margin-top:14px; max-width:640px}
.livecheck input{flex:1; min-width:0; padding:9px 12px; font-size:14px;
  background:var(--surface-2); color:var(--ink);
  border:1px solid var(--rule); border-radius:2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.livecheck input::placeholder{color:var(--ink-faint)}
.livecheck button{padding:9px 18px; font-size:14px; font-weight:600; cursor:pointer;
  background:var(--accent); color:#fff; border:0; border-radius:2px;
  font-family:"IBM Plex Sans",system-ui,sans-serif}
@media (max-width:520px){.livecheck{flex-direction:column}}
.livecheck button:disabled{opacity:.6; cursor:progress}
.livecheck button:focus-visible,.livecheck input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.wrap.live{padding-bottom:0}
.wrap.live:empty{display:none}
.lc-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 14px; padding:14px 16px;
  border-bottom:1px solid var(--rule-soft)}
.lc-dom{font-family:"IBM Plex Mono",monospace; font-size:16px; font-weight:600; word-break:break-all}
.lc-conf{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft)}
.lc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))}
.lc-grid > div{padding:14px 16px; border-right:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft); min-width:0}
.lc-grid h3{font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
.tier{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em;
  padding:2px 7px; border-radius:2px; border:1px solid var(--rule); color:var(--ink-soft); white-space:normal}
.tier.registry,.tier.official,.tier.vies{background:var(--verify-soft); color:var(--verify); border-color:var(--verify)}
.tier.company_source{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.tier.search_evidence,.tier.public_source{background:var(--warn-soft); color:var(--warn); border-color:var(--warn)}
.tier.unverified{background:var(--surface-2); color:var(--ink-faint)}
.tier.provisional{background:var(--warn-soft); color:var(--warn); border-color:var(--warn); border-style:dashed}
.ev-list{list-style:none; margin:0; padding:0; font-size:12.5px}
.ev-list li{padding:7px 0; border-bottom:1px solid var(--rule-soft); overflow-wrap:anywhere; min-width:0}
/* Quoted source text is prose: wrap it inside the column, never let it run under the next one. */
.ev-list .snip{font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:12px; line-height:1.5;
  white-space:normal; overflow-wrap:anywhere; word-break:break-word; color:var(--ink-soft)}
.ev-list li:last-child{border-bottom:0}
.ev-url{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-soft); word-break:break-all; margin-top:3px}
.chk{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 14px; font-size:12.5px}
.chk dt{color:var(--ink-soft)} .chk dd{margin:0; font-family:"IBM Plex Mono",monospace; font-size:11.5px}
.chk dd.good{color:var(--verify)} .chk dd.bad{color:var(--seal)} .chk dd.meh{color:var(--ink-faint)}
.lc-conflict{margin:0; padding:10px 16px; background:var(--warn-soft); color:var(--warn); font-size:13px;
  border-bottom:1px solid var(--rule-soft)}
.lc-note{padding:12px 16px; font-size:12.5px; color:var(--ink-soft); background:var(--surface-2)}
.lc-msg{padding:14px 16px; font-size:14px}
.lc-msg.err{color:var(--seal)}
.lc-infra{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-soft); white-space:pre-wrap;
  word-break:break-all; margin:8px 0 0}
details.lc summary{cursor:pointer; font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--accent)}
details.lc summary:focus-visible{outline:2px solid var(--accent)}
/* lookup progress: real stages from the server, not a timer */
.steps{list-style:none; margin:0; padding:12px 16px 4px; display:flex; flex-wrap:wrap; gap:8px 22px}
.step{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-faint)}
.step .mark{width:16px; text-align:center; font-weight:600}
.step.done{color:var(--ink)} .step.done .mark{color:var(--verify)}
.step.active{color:var(--ink); font-weight:600}
.step.skipped{color:var(--ink-faint)} .step.failed,.step.cancelled{color:var(--seal)}
.step .why{font-size:11px; color:var(--ink-faint); font-weight:400}
.spin{width:12px; height:12px; border-radius:50%; border:2px solid var(--accent-soft);
  border-top-color:var(--accent); animation:spin .8s linear infinite; margin:0 2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none; border-color:var(--accent)}}
.prov{margin:0 16px 12px; padding:10px 14px; border:1px dashed var(--rule); background:var(--surface-2)}
.prov .why{font-size:12px; color:var(--ink-soft)}
.lc-actions{padding:10px 16px 14px}
.btn-ghost{padding:7px 14px; font-size:13px; cursor:pointer; background:none; color:var(--ink);
  border:1px solid var(--rule); border-radius:2px; font-family:"IBM Plex Sans",system-ui,sans-serif}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.livecheck input[readonly]{opacity:.75}
/* compliance profile */
.fs{display:inline-block; font-size:11.5px; margin-left:4px; white-space:normal}
.fs.ok{color:var(--verify)} .fs.pub{color:var(--accent)} .fs.bad{color:var(--warn); font-weight:600}
.fs.na{color:var(--ink-faint)}
.pfields dd{overflow-wrap:anywhere}

.ptable th{white-space:nowrap; vertical-align:top}
.ptable td{vertical-align:top; overflow-wrap:anywhere; font-size:13px}
.ptable tbody th{font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:12.5px; letter-spacing:0;
  text-transform:none; color:var(--ink-soft); padding:9px 16px}
details.srcs{margin-top:4px}
details.srcs summary{cursor:pointer; font-size:11.5px; color:var(--accent)}
details.srcs summary:focus-visible{outline:2px solid var(--accent)}
details.srcs ul{list-style:none; margin:6px 0 0; padding:0}
details.srcs li{padding:5px 0; border-top:1px solid var(--rule-soft)}
.srcgroup{margin-top:6px}
.why{font-size:12px; color:var(--ink-soft)}
/* example worklist and the check form heading */
.checkh{font-size:15px; margin-top:16px; letter-spacing:.02em}
.checkp{margin:3px 0 0; font-size:13px; color:var(--ink-soft); max-width:70ch}
.whygrid p{margin:0 0 8px}
.sflist{margin:10px 0 0; padding:0 0 0 18px; font-size:13.5px}
.sflist > li{margin:0 0 10px}
.auto{font-size:12px; margin-top:3px}
.sflist .kind{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--seal); margin-right:6px}
.sflist li.info .kind{color:var(--accent)}
.sflist li.info{color:var(--ink-soft)}
.vchip.v-info{background:var(--accent-soft); color:var(--accent)}
.bench{flex-basis:100%; margin:4px 0 0; font-size:13.5px; color:var(--ink)}
/* example findings pagination */
.pager{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px;
  padding:12px 16px; border-top:1px solid var(--rule-soft); background:var(--surface-2)}
.pg-range{margin:0; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-soft)}
.pg-links{display:flex; flex-wrap:wrap; gap:6px}
.pg-num,.pg-step{display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:32px;
  padding:0 10px; border:1px solid var(--rule); border-radius:2px; font-size:13px;
  color:var(--accent); background:var(--surface); text-decoration:none}
.pg-num:hover,a.pg-step:hover{background:var(--accent-soft)}
.pg-num.active{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:600}
span.pg-step{color:var(--ink-faint); border-color:var(--rule-soft); background:none; cursor:default}
.pg-num:focus-visible,.pg-step:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
@media (pointer:coarse), (max-width:760px){.pg-num,.pg-step{min-width:44px; height:44px}}
@media (max-width:520px){.pg-links{width:100%} .pg-step{order:1; flex:1 1 40%}}
.auto.yes{color:var(--verify)} .auto.no{color:var(--ink-faint)}
.shop .snip{font-family:"IBM Plex Sans",system-ui,sans-serif; white-space:normal; overflow-wrap:anywhere}
</style>

<div class="masthead"><div class="mast-in">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap">
    <div><span class="tag" id="tag"></span><h1 id="h1"></h1></div>
    <div id="langslot"></div>
  </div>
  <div class="sub" id="sub"></div>
  <h2 class="checkh" id="checkh"></h2>
  <p class="checkp" id="checkp"></p>
  <form class="livecheck" id="livecheck" novalidate>
    <input id="liveurl" name="url" autocomplete="off" spellcheck="false" maxlength="2048"
           inputmode="url" aria-label="адрес на сайт">
    <button type="submit" id="livebtn">Провери</button>
  </form>
</div></div>

<div class="wrap live" id="live" aria-live="polite"></div>
<div class="wrap" id="app"></div>

<footer class="page">
  <p id="prov"></p>
</footer>

<script>
const DATA = /*__DATA__*/null;
</script>
